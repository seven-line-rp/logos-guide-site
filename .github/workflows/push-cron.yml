# Рассылка напоминаний о парах, если на хостинге не настроен свой крон
# (deploy/push.md). Каждые 5 минут дёргает api/notify.php?cron=КЛЮЧ: сервер
# сам решает, пора ли слать «через 5 минут пара» или «пара закончилась», и
# никогда не шлёт одно и то же дважды, поэтому вместе с кроном reg.ru он не мешает.
#
# Нужны (Settings → Secrets and variables → Actions):
#   Variables: SITE_URL — адрес сайта, например https://logos-guide.ru
#   Secrets:   PUSH_CRON_KEY — то же, что push_cron_key (или notices_key) в logos-ai-config.php
# Без секрета задание просто пропускается. Расписание GitHub работает только в
# основной ветке и может опаздывать на несколько минут.
name: Push cron

on:
  schedule:
    # 5:00–14:55 UTC = 8:00–17:55 по Москве, с понедельника по субботу
    - cron: '*/5 5-14 * * 1-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Запустить рассылку
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUSH_CRON_KEY: ${{ secrets.PUSH_CRON_KEY }}
        run: |
          if [ -z "$PUSH_CRON_KEY" ] || [ -z "$SITE_URL" ]; then
            echo "PUSH_CRON_KEY или SITE_URL не заданы — пропускаем (deploy/push.md)."
            exit 0
          fi
          curl -fsS --max-time 60 --get --data-urlencode "cron=$PUSH_CRON_KEY" "${SITE_URL%/}/api/notify.php" | head -c 2000
