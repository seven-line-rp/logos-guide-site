# Публикация релиза GitHub для версии из package.json.
# Запускается сама, когда в main меняются package.json, CHANGELOG.md или этот
# файл, по тегу v* и вручную (Actions → Release → Run workflow). Если релиз
# для текущей версии уже есть, ничего не делает. Тег v<версия> создаётся на
# проверенном коммите. Версии с дефисом (alpha, beta, rc) — pre-release.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', 'CHANGELOG.md', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия и тег
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $TAG в package.json" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже опубликован — пропускаем."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm

      - name: Проверка и сборка
        if: env.SKIP != '1'
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Описание релиза из CHANGELOG.md
        if: env.SKIP != '1'
        run: |
          awk -v version="## $VERSION" '
            $0 == version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "В CHANGELOG.md нет раздела ## $VERSION" >&2
            exit 1
          fi
          TITLE="$(grep -m1 '^\*\*' release-notes.md | sed 's/\*\*//g')"
          echo "TITLE=${TITLE:-$TAG}" >> "$GITHUB_ENV"
          cd dist && zip -qr "../logos-guide-site-$TAG.zip" .

      - name: Создать релиз
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "logos-guide-site-$TAG.zip" \
            --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md $PRERELEASE
