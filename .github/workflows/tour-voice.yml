# Озвучка экскурсии нейросетевыми голосами Microsoft (scripts/tour-voice.py).
# Запускается сама, когда в ветке меняются тексты экскурсий или скрипт, и
# вручную (Actions → Tour voice → Run workflow). Готовые mp3 коммитит в ту же
# ветку, если они изменились.
name: Tour voice

on:
  push:
    paths: ['src/tours.js', 'scripts/tour-voice.py', '.github/workflows/tour-voice.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tour-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Синтез
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
          python3 scripts/tour-voice.py

      - name: Коммит записей
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/voice/tour
          if git diff --cached --quiet; then
            echo "Записи не изменились."
            exit 0
          fi
          git commit -m "Озвучка экскурсии: живые голоса Светлана и Дмитрий"
          git push
