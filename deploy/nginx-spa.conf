# ЛОГОС:Путеводитель — фрагмент конфигурации nginx.
# Нужен, если сайт стоит на VPS или на тарифе, где работает только nginx.
# На общем хостинге reg.ru обычно достаточно public/.htaccess — он уезжает в dist.
# Пошаговая инструкция — в deploy/reg-ru.md.
#
# Что исправить под себя:
#   1. root — путь к загруженной папке dist;
#   2. server_name — ваш домен;
#   3. ssl-сертификат удобнее выпустить в панели reg.ru, тогда конфиг правится там же.
#
# После правки: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name logos-guide.ru www.logos-guide.ru;

    root /var/www/logos-guide/dist;
    index index.html;

    # Главное правило: любой адрес, которому не соответствует файл
    # (/map, /rooms, /route?from=118…), отдаёт index.html, а нужный раздел
    # определяет React Router. Без него перезагрузка страницы даёт «404 Not Found».
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запасной вариант на случай, если try_files кто-то уберёт: серверная страница
    # 404 запомнит адрес и вернёт посетителя на ту же страницу (код ответа остаётся 404).
    error_page 404 /404.html;

    # В именах файлов сборки есть хэш — кэшируем надолго.
    # Отсутствующий файл отдаёт честный 404, а не HTML вместо js/css.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Озвучка и картинки меняются редко.
    location ~* \.(mp3|png|jpe?g|gif|svg|webp|ico|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html не кэшируем, иначе обновления сайта будут видны не сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Служебные файлы не должны попадать в выдачу.
    location ~ /\. {
        deny all;
    }
}
