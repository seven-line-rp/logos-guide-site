    <script>
      /* spa-fallback:restore */
      // Если хостинг не умеет отдавать index.html для произвольных адресов (перезагрузка
      // страницы /map, /rooms, /route…), серверная страница 404.html присылает нас сюда
      // с параметром ?__redirect=%2Fmap%3Ffrom%3D118. Возвращаем настоящий адрес до того,
      // как загрузится приложение, — тогда после перезагрузки открывается та же страница.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search)
          var target = params.get('__redirect')
          if (!target) return
          params.delete('__redirect')
          var url = new URL(target, window.location.origin)
          // Принимаем только внутренние адреса: «/map», но не «//evil.com» и не «\evil.com».
          if (url.origin !== window.location.origin) return
          params.forEach(function (value, key) { url.searchParams.append(key, value) })
          if (!url.hash) url.hash = window.location.hash
          // Состояние history сохраняем: его читает React Router при запуске приложения.
          window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash)
        } catch (_error) {
          // Без URLSearchParams/history адрес останется как есть — приложение всё равно откроется.
        }
      })()
    </script>

      #splash {

    <script>
      /* splash:control */
      // Заставка уходит, когда приложение отрисовалось (событие logos-app-ready из main.jsx),
      // но не раньше, чем доиграет анимация. Клик или клавиша закрывают её сразу.
      // Показываем один раз за сеанс; ?splash=1 — показать снова, ?splash=0 — не показывать.
      (function () {
        var root = document.documentElement
        var splash = document.getElementById('splash')
        if (!splash) return
        var drop = function () { if (splash.parentNode) splash.parentNode.removeChild(splash) }
        try {
          var asked = new URLSearchParams(window.location.search).get('splash')
          var seen = false
          try { seen = sessionStorage.getItem('logos-splash') === '1' } catch (_error) { seen = false }
          if (asked === '0' || (seen && asked !== '1')) { drop(); return }
          try { sessionStorage.setItem('logos-splash', '1') } catch (_error) { /* приватный режим */ }
          var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (still) splash.className = 'is-still'
          var minimum = still ? 450 : 1750
          var started = Date.now()
          var gone = false
          root.classList.add('splash-on')
          var leave = function () {
            if (gone) return
            gone = true
            splash.className += ' is-leaving'
            root.classList.remove('splash-on')
            window.setTimeout(drop, 450)
          }
          window.addEventListener('logos-app-ready', function () {
            window.setTimeout(leave, Math.max(0, minimum - (Date.now() - started)))
          })
          splash.addEventListener('click', leave)
          window.addEventListener('keydown', leave)
          // Если сборка не загрузилась, заставка всё равно не должна висеть.
          window.setTimeout(leave, 8000)
        } catch (_error) {
          root.classList.remove('splash-on')
          drop()
        }
      })()
