<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5fe8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ЛОГОС" />
    <meta name="description" content="ЛОГОС:Путеводитель — интерактивный путеводитель по колледжу «Логос»: карта этажей, поиск кабинетов и преподавателей, маршруты по коридорам." />
    <title>ЛОГОС:Путеводитель — карта и маршруты по колледжу</title>
    <!-- Основной адрес сайта. Для поисковиков это единственная версия страницы:
         копии на других доменах (www, технический адрес хостинга) в выдачу не попадают. -->
    <link rel="canonical" href="https://logos-guide.ru/" />
    <meta name="application-name" content="ЛОГОС:Путеводитель" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ЛОГОС:Путеводитель" />
    <meta property="og:title" content="ЛОГОС:Путеводитель — карта и маршруты по колледжу" />
    <meta property="og:description" content="Карта этажей, поиск кабинетов и преподавателей, маршруты по коридорам." />
    <meta property="og:url" content="https://logos-guide.ru/" />
    <meta property="og:image" content="https://logos-guide.ru/icon-512.png" />
    <meta property="og:locale" content="ru_RU" />
    <!-- Значок сайта. Google в выдаче берёт квадратный значок размером кратным 48 px
         (favicon.ico 48×48 и PNG 96/192), SVG — для современных браузеров. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Название сайта и логотип для поиска (Google показывает их над ссылкой). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://logos-guide.ru/#website",
            "name": "ЛОГОС:Путеводитель",
            "alternateName": ["Логос Путеводитель", "ЛОГОС Путеводитель", "Путеводитель колледжа Логос"],
            "url": "https://logos-guide.ru/",
            "inLanguage": "ru"
          },
          {
            "@type": "Organization",
            "@id": "https://logos-guide.ru/#organization",
            "name": "ЛОГОС:Путеводитель",
            "url": "https://logos-guide.ru/",
            "logo": "https://logos-guide.ru/icon-512.png"
          }
        ]
      }
    </script>
    <script>
      /* spa-fallback:restore */
      // Если хостинг не умеет отдавать index.html для произвольных адресов (перезагрузка
      // страницы /map, /rooms, /route…), серверная страница 404.html присылает нас сюда
      // с параметром ?__redirect=%2Fmap%3Ffrom%3D118. Возвращаем настоящий адрес до того,
      // как загрузится приложение, — тогда после перезагрузки открывается та же страница.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search)
          var target = params.get('__redirect')
          if (!target) return
          params.delete('__redirect')
          var url = new URL(target, window.location.origin)
          // Принимаем только внутренние адреса: «/map», но не «//evil.com» и не «\evil.com».
          if (url.origin !== window.location.origin) return
          params.forEach(function (value, key) { url.searchParams.append(key, value) })
          if (!url.hash) url.hash = window.location.hash
          // Состояние history сохраняем: его читает React Router при запуске приложения.
          window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash)
        } catch (_error) {
          // Без URLSearchParams/history адрес останется как есть — приложение всё равно откроется.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
